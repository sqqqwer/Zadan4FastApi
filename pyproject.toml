[project]
name = "zadan4fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Владислав Чернявский",email = "cernavskijv877@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
exclude = [".git", "__pycache__", "**/migrations/*.py", "alembic/", ".venv"]
force-exclude = true
line-length = 119
lint.extend-select = ["D", "RUF", "I", "E", "W", "F", "UP", "B", "SIM", "PL", "TCH"]
lint.ignore = [
    "RUF001",
    "D100",
    "D104",
    "D106",
    "D105"
]
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.asyncio_mode = "auto"
ini_options.log_cli = false

[tool.mypy]
plugins = [
    
]
mypy_path = "src"
[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
