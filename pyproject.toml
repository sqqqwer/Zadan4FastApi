[project]
name = "zadan4fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Владислав Чернявский",email = "cernavskijv877@gmail.com"}
]
requires-python = ">=3.12"

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
tasks-platform-shared = { path = "shared", develop = true }
tasks-platform-auth = { path = "services/auth", develop = true }
tasks-platform-org = { path = "services/org", develop = true }
tasks-platform-tasks = { path = "services/tasks", develop = true }
tasks-platform-saga = { path = "services/saga", develop = true }

[tool.ruff]
target-version = "py312"
src = [".", "services/auth", "services/org", "services/tasks", "services/saga", "shared"]
extend-exclude = ["**/alembic/**", "**/migrations/**", "artefacts", "__pycache__"]
force-exclude = true
line-length = 119

[tool.ruff.lint]
extend-select = ["D", "RUF", "I", "E", "W", "F", "UP", "B", "SIM", "PL", "TC"]
ignore = [
    "RUF001",
    "D100",
    "D104",
    "D106",
    "D105"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest]
ini_options.testpaths = ["tests"]
ini_options.asyncio_mode = "auto"
ini_options.log_cli = false

[tool.mypy]
mypy_path = ["services/auth", "services/org", "services/tasks", "services/saga", "shared"]
plugins = [
    
]
[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true


[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
]
