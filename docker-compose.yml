x-auth-service: &auth-service
  image: tasks-platform-auth:local
  pull_policy: build
  build:
    context: .
    dockerfile: services/auth/Dockerfile
  env_file: ./services/auth/.env

x-org-service: &org-service
  image: tasks-platform-org:local
  pull_policy: build
  build:
    context: .
    dockerfile: services/org/Dockerfile
  env_file: ./services/org/.env

x-tasks-service: &tasks-service
  image: tasks-platform-tasks:local
  pull_policy: build
  build:
    context: .
    dockerfile: services/tasks/Dockerfile
  env_file: ./services/tasks/.env

x-saga-service: &saga-service
  image: tasks-platform-saga:local
  pull_policy: build
  build:
    context: .
    dockerfile: services/saga/Dockerfile
  env_file: ./services/saga/.env

x-notification-service: &notification-service
  image: tasks-platform-notification:local
  pull_policy: build
  build:
    context: .
    dockerfile: services/notification/Dockerfile
  env_file: ./services/notification/.env

volumes:
  pg_auth_data:
  pg_org_data:
  pg_tasks_data:
  pg_saga_data:
  kafka_data:
  pg_notification_data:

services:
  gateway:
    image: tasks-platform-gateway:local
    pull_policy: build
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8000"
    env_file: ./services/gateway/.env
    secrets:
      - jwt_public_key
    depends_on:
      - auth
      - org
      - tasks
      - saga

  db_auth:
    image: postgres:17
    env_file: ./services/auth/.env
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  db_org:
    image: postgres:17
    env_file: ./services/org/.env
    volumes:
      - pg_org_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  db_tasks:
    image: postgres:17
    env_file: ./services/tasks/.env
    volumes:
      - pg_tasks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  db_saga:
    image: postgres:17
    env_file: ./services/saga/.env
    volumes:
      - pg_saga_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate_auth:
    <<: *auth-service
    depends_on:
      db_auth:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  auth:
    <<: *auth-service
    depends_on: &auth-dependencies
      db_auth:
        condition: service_healthy
      migrate_auth:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    secrets:
      - jwt_private_key
      - jwt_public_key

  auth_publisher:
    <<: *auth-service
    depends_on: *auth-dependencies
    command: ["python", "-m", "auth.main_publisher"]
    restart: unless-stopped
    stop_signal: SIGINT

  auth_consumer:
    <<: *auth-service
    depends_on: *auth-dependencies
    command: ["python", "-m", "auth.main_consumer"]
    restart: unless-stopped
    stop_signal: SIGINT

  migrate_org:
    <<: *org-service
    depends_on:
      db_org:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  org:
    <<: *org-service
    depends_on: &org-dependencies
      db_org:
        condition: service_healthy
      migrate_org:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    secrets:
      - jwt_public_key

  org_publisher:
    <<: *org-service
    depends_on: *org-dependencies
    command: ["python", "-m", "org.main_publisher"]
    restart: unless-stopped
    stop_signal: SIGINT

  org_consumer:
    <<: *org-service
    depends_on: *org-dependencies
    command: ["python", "-m", "org.main_consumer"]
    restart: unless-stopped
    stop_signal: SIGINT

  migrate_tasks:
    <<: *tasks-service
    depends_on:
      db_tasks:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  tasks:
    <<: *tasks-service
    depends_on: &tasks-dependencies
      db_tasks:
        condition: service_healthy
      migrate_tasks:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    secrets:
      - jwt_public_key

  tasks_publisher:
    <<: *tasks-service
    depends_on: *tasks-dependencies
    command: ["python", "-m", "tasks.main_publisher"]
    restart: unless-stopped
    stop_signal: SIGINT

  tasks_consumer:
    <<: *tasks-service
    depends_on: *tasks-dependencies
    command: ["python", "-m", "tasks.main_consumer"]
    restart: unless-stopped
    stop_signal: SIGINT

  migrate_saga:
    <<: *saga-service
    depends_on:
      db_saga:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  saga:
    <<: *saga-service
    depends_on: &saga-dependencies
      db_saga:
        condition: service_healthy
      migrate_saga:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  saga_consumer:
    <<: *saga-service
    depends_on: *saga-dependencies
    command: ["python", "-m", "saga.main_consumer"]
    restart: unless-stopped
    stop_signal: SIGINT

  saga_publisher:
    <<: *saga-service
    depends_on: *saga-dependencies
    command: ["python", "-m", "saga.main_publisher"]
    restart: unless-stopped
    stop_signal: SIGINT

  db_notification:
    image: postgres:17
    env_file: ./services/notification/.env
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate_notification:
    <<: *notification-service
    depends_on:
      db_notification:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  notification_consumer:
    <<: *notification-service
    depends_on:
      db_notification:
        condition: service_healthy
      migrate_notification:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped
    stop_signal: SIGINT

secrets:
  jwt_private_key:
    file: ./keys/test_private.pem
  jwt_public_key:
    file: ./keys/test_public.pem
