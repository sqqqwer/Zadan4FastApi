volumes:
  pg_data:

services:
  migrate:
      build: .
      env_file: .env
      depends_on:
        db:
          condition: service_healthy
      command: alembic upgrade head
      restart: "no"
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
        db:
          condition: service_healthy
        migrate:
          condition: service_completed_successfully
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
    secrets:
      - jwt_private_key
      - jwt_public_key

secrets:
  jwt_private_key:
    file: ./keys/test_private.pem
  jwt_public_key:
    file: ./keys/test_public.pem